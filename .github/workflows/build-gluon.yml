name: Build Gluon
on:
  push:
    branches:
      - main
      - next
      - 'v20[2-9][0-9].[0-9].x'
      - ffv-*
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changed:
    permissions:
      contents: read  # for dorny/paths-filter to fetch a list of changed files
      pull-requests: read  # for dorny/paths-filter to read pull requests
    runs-on: ubuntu-26.04
    outputs:
      targets: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7

      # Filter targets based on changed files
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yml

  build_firmware:
    needs: changed
    if: ${{ needs.changed.outputs.targets != '[]' && needs.changed.outputs.targets != '' }}
    strategy:
      max-parallel: 18
      fail-fast: false
      matrix:
        # Read back changed targets to create build matrix
        target: ${{ fromJSON(needs.changed.outputs.targets) }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Show system information
        run: contrib/actions/show-system-info.sh

      - run: ls --version | grep -q uutils && sudo apt-get update && sudo apt-get remove -y --allow-remove-essential coreutils-from-uutils

      - name: Remove non-required software
        run: contrib/actions/free-runner-space.sh

      - name: Build Docker container
        run: docker build -t gluon-ci-container contrib/docker

      - name: Build Gluon
        run: docker run --rm -v $PWD:/gluon-ci -w /gluon-ci --user "$(id -u):$(id -g)" gluon-ci-container contrib/actions/run-build.sh ${{ matrix.target }}

      - name: Check Image size
        run: contrib/check-image-size.py --github-actions --overhead 256 output/meta/openwrt-profiles/${{ matrix.target }}.json

      - name: Archive build logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}_logs
          path: openwrt/logs

      - name: Archive build output
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}_output
          path: output

      - name: Archive metadata
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}_metadata
          path: output/meta

  release_firmware:
    needs: build_firmware
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - name: Determine release tag 
        id: release_tag
        run: | 
          RELEASE_VERSION="${{ env.RELEASE_VERSION }}"
          RELEASE_TAG_PREFIX="${RELEASE_VERSION%%-*}"
          RELEASE_TAG_SUFFIX="latest"
          RELEASE_TAG="${RELEASE_TAG_PREFIX}-${RELEASE_TAG_SUFFIX}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$RELEASE_TAG"

      - uses: actions/download-artifact@v8
        with:
          pattern: '*_output'
          skip-decompress: true

      - name: Delete existing tag
        shell: sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER_REPO: ${{ github.repository }}
        continue-on-error: true
        run: gh release delete "${{ steps.release_tag.outputs.RELEASE_TAG }}" --cleanup-tag --yes --repo $GH_OWNER_REPO

      - name: Publish release files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER_REPO: ${{ github.repository }}
        run: |
          # create release-notes
          cat > /tmp/release-notes.txt <<EOF
          ### Unofficially Freifunk Release
          ## ${{ env.RELEASE_VERSION }}

          - This package was generated by the modified build-gluon GitHub Action.
          - The files are downloadable in the Assets.
          - For more information, see the [README.md in the repository](https://github.com/${{ github.repository }}/blob/${{ github.ref }}/README.md).
          EOF
          # create release
          gh release create "${{ steps.release_tag.outputs.RELEASE_TAG }}" \
            --title "Unofficially Freifunk Release - ${{ env.RELEASE_VERSION }}" \
            --notes-file /tmp/release-notes.txt \
            --prerelease=false \
            --draft=false \
            --latest=true \
            --repo "$GH_OWNER_REPO" \
            $(find ./ -iname "*.zip" -type f 2>/dev/null)
